services:
  localstack:
    container_name: '${LOCALSTACK_DOCKER_NAME:-localstack-main}'
    image: localstack/localstack
    ports:
      - '127.0.0.1:4566:4566' # LocalStack Gateway
      # - '127.0.0.1:4510-4559:4510-4559' # external services port range
      # - '127.0.0.1:443:443' # LocalStack HTTPS Gateway
    environment:
      # Activate LocalStack for AWS: https://docs.localstack.cloud/getting-started/auth-token/
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?}
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
      - PERSISTENCE=${PERSISTENCE:-0}
      - SERVICES=s3
    volumes:
      - '${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'
  mongo:
    image: mongo:8.0
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/Users/yaegerknight/Personal/backup/data/db
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.8  # must match your client version
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - es-data:/Users/yaegerknight/Personal/backup/elasticsearch/data

  kafka:
    image: apache/kafka:4.1.2        # runs as a single-node KRaft broker by default, on localhost:9092
    ports:
      - '127.0.0.1:9092:9092'

volumes:
  mongo-data:
  es-data: